services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: prod
    container_name: car_maintenance_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./car-maintenance/.env:/var/www/.env:ro
      - ./car-maintenance/storage:/var/www/storage
      - ./car-maintenance/bootstrap/cache:/var/www/bootstrap/cache
    environment:
      APP_ENV: production
      APP_DEBUG: false
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    networks:
      - car_maintenance_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: >
      sh -c "php artisan config:cache &&
             exec php-fpm"

  web:
    image: nginx:alpine
    container_name: car_maintenance_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./car-maintenance/public:/var/www/public
      - ./docker/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/web/ssl:/etc/nginx/ssl
    networks:
      - car_maintenance_network
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: mysql:8.0
    container_name: car_maintenance_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: car_maintenance
      MYSQL_USER: car_maintenance
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - db_data:/var/lib/mysql
    secrets:
      - db_root_password
      - db_password
    networks:
      - car_maintenance_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:alpine
    container_name: car_maintenance_redis
    restart: unless-stopped
    networks:
      - car_maintenance_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: prod
    container_name: car_maintenance_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - ./car-maintenance/.env:/var/www/.env:ro
      - ./car-maintenance/storage:/var/www/storage
    environment:
      APP_ENV: production
      APP_DEBUG: false
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    networks:
      - car_maintenance_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: prod
    container_name: car_maintenance_queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./car-maintenance/.env:/var/www/.env:ro
      - ./car-maintenance/storage:/var/www/storage
    environment:
      APP_ENV: production
      APP_DEBUG: false
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    networks:
      - car_maintenance_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  car_maintenance_network:
    driver: bridge

volumes:
  db_data:

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
  db_password:
    file: ./secrets/db_password.txt
