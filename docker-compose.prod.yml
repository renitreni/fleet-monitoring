version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: car_maintenance_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
    networks:
      - car_maintenance_network
    depends_on:
      - db
      - redis

  web:
    image: nginx:alpine
    container_name: car_maintenance_web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./public:/var/www/public
      - ./docker/web/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/web/ssl:/etc/nginx/ssl
    networks:
      - car_maintenance_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: car_maintenance_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MYSQL_DATABASE: car_maintenance
      MYSQL_USER: car_maintenance
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - db_data:/var/lib/mysql
    secrets:
      - db_root_password
      - db_password
    networks:
      - car_maintenance_network

  redis:
    image: redis:alpine
    container_name: car_maintenance_redis
    restart: unless-stopped
    networks:
      - car_maintenance_network

  scheduler:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: car_maintenance_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - ./storage:/var/www/storage
    networks:
      - car_maintenance_network
    depends_on:
      - db
      - redis

  queue:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: car_maintenance_queue
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - ./storage:/var/www/storage
    networks:
      - car_maintenance_network
    depends_on:
      - db
      - redis

networks:
  car_maintenance_network:
    driver: bridge

volumes:
  db_data:

secrets:
  db_root_password:
    file: ./secrets/db_root_password.txt
  db_password:
    file: ./secrets/db_password.txt
