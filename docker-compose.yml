services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: car_maintenance_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./car-maintenance:/var/www
    networks:
      - car_maintenance_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      # Docker-specific overrides for the Laravel app
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: car_maintenance
      DB_USERNAME: root
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REDIS_PASSWORD: null
      REDIS_PORT: 6379
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: null
      MAIL_PASSWORD: null
      MAIL_ENCRYPTION: null
      MAIL_FROM_ADDRESS: "hello@car-maintenance.test"
      MAIL_FROM_NAME: "${APP_NAME:-Car Maintenance Assistant}"
      APP_URL: "http://localhost:8080"
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: car_maintenance_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./car-maintenance:/var/www
      - ./docker/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - car_maintenance_network
    depends_on:
      - app
      - node

  db:
    image: mysql:8.0
    container_name: car_maintenance_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: car_maintenance
      MYSQL_USER: car_maintenance
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - car_maintenance_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: car_maintenance_node
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./car-maintenance:/var/www
      - node_modules:/var/www/node_modules
    networks:
      - car_maintenance_network
    ports:
      - "5173:5173"

  redis:
    image: redis:7-alpine
    container_name: car_maintenance_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - car_maintenance_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: car_maintenance_mailpit
    restart: unless-stopped
    ports:
      - "1026:1025"
      - "8026:8025"
    networks:
      - car_maintenance_network
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

networks:
  car_maintenance_network:
    driver: bridge

volumes:
  db_data:
  node_modules:
